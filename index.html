@import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800;900&display=swap');

:root {
  --bg: #0a0e1a;
  --bg-card: #141a2a;
  --surface: #0f1422;
  --border: rgba(255,255,255,.08);
  --text: #e8eaf0;
  --text-dim: #8892a6;
  --accent: #06b6d4;
  --accent-2: #3b82f6;
  --accent-3: #8b5cf6;
  --grad: linear-gradient(135deg, #06b6d4 0%, #3b82f6 50%, #8b5cf6 100%);

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--text); font-family: 'Pretendard', -apple-system, sans-serif; line-height: 1.7; -webkit-font-smoothing: antialiased; }

.app { min-height: 100vh; }
.container { max-width: 1080px; margin: 0 auto; padding: 0 24px; }
.section { padding: 96px 24px; position: relative; }
.sec-dark { background: var(--surface); }
.section-head { text-align: center; margin-bottom: 56px; }
.section-label { font-size: .8rem; letter-spacing: .15em; text-transform: uppercase; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 14px; font-weight: 700; }
.section-title { font-size: clamp(1.6rem, 3.5vw, 2.3rem); font-weight: 800; letter-spacing: -.02em; margin-bottom: 14px; }
.section-sub { color: var(--text-dim); max-width: 540px; margin: 0 auto; }

.btn { display: inline-flex; align-items: center; justify-content: center; padding: 12px 24px; border-radius: 99px; font-weight: 600; transition: var(--trans); white-space: nowrap; }
.btn-lg { padding: 16px 32px; font-size: 1rem; }
.btn-primary { background: var(--grad); color: #fff; }

.btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

.chip { display: inline-block; padding: 6px 14px; border-radius: 99px; font-size: .8rem; background: rgba(6,182,212,.12); color: var(--accent); border: 1px solid rgba(6,182,212,.3); }
.tag { display: inline-block; padding: 4px 10px; border-radius: 99px; font-size: .72rem; background: rgba(255,255,255,.06); color: var(--text-dim); }
.tag-active { background: rgba(59,130,246,.18); color: #93c5fd; }

.anim { opacity: 0; transform: translateY(24px); transition: opacity .7s var(--trans), transform .7s var(--trans); }
.anim.shown { opacity: 1; transform: none; }
.spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 12px; }

.state-msg { text-align: center; color: var(--text-dim); padding: 60px 0; }

.nav { position: fixed; top: 0; left: 0; right: 0; z-index: 50; background: rgba(10,14,26,.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); }
.nav-inner { max-width: 1080px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.nav-logo { font-size: 1.1rem; font-weight: 800; color: var(--text); letter-spacing: -.02em; }
.nav-links { display: flex; gap: 28px; }
.nav-link { color: var(--text-dim); font-size: .9rem; font-weight: 500; transition: var(--trans); }
.nav-link:hover, .nav-active { color: var(--accent); }
.nav-cta { padding: 9px 18px; border-radius: 99px; background: var(--grad); color: #fff; font-weight: 600; font-size: .88rem; transition: var(--trans); }
.nav-cta:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(59,130,246,.35); }

.hero { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 120px 24px 80px; position: relative; overflow: hidden; }
.hero::before, .hero::after { content: ''; position: absolute; width: 600px; height: 600px; border-radius: 50%; filter: blur(140px); opacity: .25; pointer-events: none; }
.hero::before { background: var(--accent); top: -200px; left: -100px; }
.hero::after { background: var(--accent-3); bottom: -200px; right: -100px; }
.hero-inner { position: relative; max-width: 820px; }
.hero-chip { margin-bottom: 28px; }
.hero-title { font-size: clamp(2rem, 5.5vw, 3.6rem); font-weight: 900; letter-spacing: -.03em; line-height: 1.2; margin-bottom: 22px; }

.hero-stats { display: flex; gap: 48px; justify-content: center; flex-wrap: wrap; }

.result-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }

.match-card-title { font-size: 1.15rem; font-weight: 800; margin-bottom: 8px; letter-spacing: -.01em; }

.rev-meta-sub { font-size: .75rem; color: var(--text-dim); }
.car-stars { font-size: 1.4rem; color: #fbbf24; letter-spacing: 4px; margin-bottom: 20px; text-align: center; }
.car-quote { font-size: 1.05rem; line-height: 1.75; text-align: center; margin-bottom: 28px; }
.car-foot { display: flex; align-items: center; gap: 12px; justify-content: center; margin-bottom: 28px; }
.car-nav { display: flex; align-items: center; justify-content: center; gap: 24px; }
.car-nav-btn { width: 42px; height: 42px; border-radius: 50%; background: var(--bg); border: 1px solid var(--border); font-size: 1.1rem; transition: var(--trans); }
.car-nav-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.car-nav-btn:disabled { opacity: .3; cursor: not-allowed; }
.car-idx { font-size: .9rem; color: var(--text-dim); min-width: 50px; text-align: center; }

.form-wrap { max-width: 540px; margin: 0 auto; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 36px; }
.form-section-head { text-align: center; margin-bottom: 24px; }
.form-section-title { font-size: 1.4rem; font-weight: 800; letter-spacing: -.02em; margin-bottom: 14px; }
.form-row { margin-bottom: 22px; }
.form-label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: 8px; color: var(--text-dim); }
.form-input, .form-textarea { width: 100%; padding: 12px 14px; border-radius: var(--radius-sm); background: var(--bg); border: 1px solid var(--border); color: var(--text); font-size: .95rem; transition: var(--trans); }
.form-input:focus, .form-textarea:focus { outline: none; border-color: var(--accent); }
.form-textarea { min-height: 120px; resize: vertical; }
.form-stars { display: flex; gap: 6px; }
.form-star { font-size: 1.6rem; color: var(--border); transition: var(--trans); padding: 4px; }
.form-star:hover, .s-active { color: #fbbf24; transform: scale(1.15); }
.form-counter { font-size: .75rem; color: var(--text-dim); margin-top: 6px; text-align: right; }
.form-submit { width: 100%; }
.form-success { text-align: center; padding: 20px 0; }
.form-success-icon { font-size: 2.6rem; margin-bottom: 14px; }
.form-success-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 8px; }
.form-success-sub { color: var(--text-dim); margin-bottom: 22px; font-size: .9rem; }

.footer { border-top: 1px solid var(--border); padding: 40px 24px 28px; text-align: center; }
.footer-brand { font-size: 1rem; font-weight: 800; margin-bottom: 8px; }
.footer-copy { color: var(--text-dim); font-size: .8rem; }

@media (max-width: 768px) {
  .section { padding: 64px 16px; }
  .container { padding: 0 16px; }
  .nav-links { display: none; }
  .hero { padding: 100px 16px 60px; }
  .hero-buttons { flex-direction: column; align-items: stretch; }
  .hero-stats { gap: 24px; }
  .result-grid, .rev-grid { grid-template-columns: 1fr; }
  .form-wrap { padding: 24px; }
  .modal { padding: 36px 22px 24px; }
  .quiz-question { font-size: 1.4rem; }
  .quiz-opt { padding: 16px 18px; }
}
